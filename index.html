<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The page title will be updated dynamically by script.js -->
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: Syne (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════════════════════════════
       NAVIGATION BAR
       Generated dynamically by renderNav()
  ════════════════════════════════════════ -->
  <nav id="navbar">
    <div class="nav-logo" id="nav-logo"><!-- filled by JS --></div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links"><!-- filled by JS --></ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
  </nav>

  <!-- ═══════════════════════════════════════
       MAIN CONTENT
       All sections are empty shells.
       JavaScript fills them with real content.
  ════════════════════════════════════════ -->
  <main>

    <!-- HOME SECTION -->
    <section id="home" class="section section-home">
      <div class="home-content">
        <p class="home-greeting" id="home-greeting"><!-- filled by JS --></p>
        <h1 class="home-name" id="home-name"><!-- filled by JS --></h1>
        <p class="home-tagline" id="home-tagline"><!-- filled by JS --></p>
        <div class="home-cta" id="home-cta"><!-- filled by JS --></div>
      </div>
      <div class="home-visual">
        <div class="avatar-ring">
          <div class="avatar-initials" id="avatar-initials"><!-- filled by JS --></div>
        </div>
        <div class="floating-badge badge-1">HTML</div>
        <div class="floating-badge badge-2">CSS</div>
        <div class="floating-badge badge-3">JS</div>
      </div>
    </section>

    <!-- ABOUT SECTION -->
    <section id="about" class="section section-about">
      <div class="section-header">
        <span class="section-label">01</span>
        <h2 class="section-title">About Me</h2>
      </div>
      <div class="about-grid">
        <div class="about-text" id="about-text"><!-- filled by JS --></div>
        <div class="about-stats" id="about-stats"><!-- filled by JS --></div>
      </div>
    </section>

    <!-- SERVICES SECTION -->
    <section id="services" class="section section-services">
      <div class="section-header">
        <span class="section-label">02</span>
        <h2 class="section-title">Services</h2>
      </div>
      <div class="services-grid" id="services-grid"><!-- filled by JS --></div>
    </section>

    <!-- PROJECTS SECTION -->
    <section id="projects" class="section section-projects">
      <div class="section-header">
        <span class="section-label">03</span>
        <h2 class="section-title">Projects</h2>
      </div>
      <!-- Filter buttons are generated by JS -->
      <div class="filter-bar" id="filter-bar"><!-- filled by JS --></div>
      <div class="projects-grid" id="projects-grid"><!-- filled by JS --></div>
    </section>

    <!-- SKILLS SECTION -->
    <section id="skills" class="section section-skills">
      <div class="section-header">
        <span class="section-label">04</span>
        <h2 class="section-title">Skills</h2>
      </div>
      <div class="skills-container" id="skills-container"><!-- filled by JS --></div>
    </section>

    <!-- EDUCATION SECTION -->
    <section id="education" class="section section-education">
      <div class="section-header">
        <span class="section-label">05</span>
        <h2 class="section-title">Education</h2>
      </div>
      <div class="timeline" id="timeline"><!-- filled by JS --></div>
    </section>

    <!-- CERTIFICATIONS SECTION -->
    <section id="certifications" class="section section-certifications">
      <div class="section-header">
        <span class="section-label">06</span>
        <h2 class="section-title">Certifications</h2>
      </div>
      <div class="certifications-list" id="certifications-list"><!-- filled by JS --></div>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact" class="section section-contact">
      <div class="section-header">
        <span class="section-label">07</span>
        <h2 class="section-title">Contact</h2>
      </div>
      <div class="contact-wrapper">
        <div class="contact-info" id="contact-info"><!-- filled by JS --></div>
        <!-- Contact form (front-end only, no server needed) -->
        <form class="contact-form" id="contact-form" novalidate>
          <div class="form-group">
            <label for="cf-name">Your Name</label>
            <input type="text" id="cf-name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="cf-email">Email Address</label>
            <input type="email" id="cf-email" placeholder="john@example.com" required />
          </div>
          <div class="form-group">
            <label for="cf-subject">Subject</label>
            <input type="text" id="cf-subject" placeholder="Project Inquiry" />
          </div>
          <div class="form-group">
            <label for="cf-message">Message</label>
            <textarea id="cf-message" rows="5" placeholder="Tell me about your project..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message ✉️</button>
          <p class="form-feedback" id="form-feedback"></p>
        </form>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer id="footer"><!-- filled by JS --></footer>

  <!-- Load the JavaScript file LAST so the DOM is ready -->
  <script src="script.js"></script>
</body>
</html>
